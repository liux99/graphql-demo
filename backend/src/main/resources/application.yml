server:
  port: 8082

spring:
  datasource:
    url: jdbc:h2:mem:graphql-demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  graphql:
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations: classpath:graphql/

# H2 console (optional)
spring.h2.console.enabled: true
spring.h2.console.path: /h2-console
